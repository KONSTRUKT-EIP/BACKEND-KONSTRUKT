name: CI/CD Pipeline
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches-ignore:
      - ga-ignore-*

jobs:
  build:
    name: Build Backend 🛠️​
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build backend
        run: npm run build

  lint:
    name: Lint Backend 🎯​
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npx eslint 'src/**/*.ts'

  test:
    name: Run Tests 🏆​
    runs-on: ubuntu-latest
    environment: BACKEND
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run Unit Tests (TU)
        run: npm run test
      - name: Run Integration Tests (TI)
        run: npm run test:integration
      - name: Run End-to-End Tests (TF)
        run: npm run test:e2e
