services:
  backend:
    build: .
    container_name: konstrukt-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-konstrukt}:${POSTGRES_PASSWORD:-konstrukt}@db:5432/${POSTGRES_DB:-konstrukt}?schema=public"
    ports:
      - "3000:3000"
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    container_name: konstrukt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-konstrukt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konstrukt}
      POSTGRES_DB: ${POSTGRES_DB:-konstrukt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - konstrukt_db_data:/var/lib/postgresql/data

volumes:
  konstrukt_db_data:
