services:
  db:
    image: postgres:16-alpine
    container_name: konstrukt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-konstrukt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konstrukt}
      POSTGRES_DB: ${POSTGRES_DB:-konstrukt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - konstrukt_db_data:/var/lib/postgresql/data

volumes:
  konstrukt_db_data:
